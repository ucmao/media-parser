{% extends 'base_console.html' %}
{% block title %}注册客户账号{% endblock %}
{% block body %}
<main class="auth-wrap">
    <div class="auth-card">
        <div class="auth-brand">
            <a href="{{ url_for('web.index') }}" title="返回首页">
                <img src="{{ url_for('static', filename='images/logo-web.png') }}" alt="Media Parser Logo">
            </a>
            <h2>Media Parser 控制台</h2>
            <p class="muted" style="font-size:13px;margin:4px 0 0">多平台媒体解析与开放 API</p>
        </div>

        <div class="card" style="box-shadow:var(--shadow-lg)">
            <h1 class="title" style="font-size:20px;margin-bottom:20px">注册新账号</h1>

            {% for category, message in get_flashed_messages(with_categories=true) %}
            <div class="flash {{ category }}">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="flex-shrink:0"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
                <span>{{ message }}</span>
            </div>
            {% endfor %}

            <form method="post">
                <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                <div class="field">
                    <label>用户名 <span class="muted">(3 ~ 40 位)</span></label>
                    <input name="username" minlength="3" maxlength="40" placeholder="请输入用户名" autocomplete="username" required autofocus>
                </div>
                <div class="field">
                    <label>设置密码 <span class="muted">(至少 8 位)</span></label>
                    <div class="password-group">
                        <input name="password" type="password" minlength="8" placeholder="请输入至少 8 位密码" autocomplete="new-password" required>
                        <button type="button" class="password-toggle-btn" aria-label="切换密码可见性" title="显示密码" onclick="togglePasswordVisibility(this)">
                            <svg class="icon-eye" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
                            <svg class="icon-eye-off" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display:none"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/></svg>
                        </button>
                    </div>
                </div>
                <div class="field">
                    <label>确认密码</label>
                    <div class="password-group">
                        <input name="confirm_password" type="password" minlength="8" placeholder="请再次输入密码" autocomplete="new-password" required>
                        <button type="button" class="password-toggle-btn" aria-label="切换密码可见性" title="显示密码" onclick="togglePasswordVisibility(this)">
                            <svg class="icon-eye" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
                            <svg class="icon-eye-off" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display:none"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/></svg>
                        </button>
                    </div>
                </div>
                <div style="margin-top:24px">
                    <button type="submit" class="btn btn-primary btn-block" style="height:42px;font-size:14px">立即注册</button>
                </div>
            </form>

            <div style="margin-top:20px;padding-top:16px;border-top:1px solid var(--line-subtle);text-align:center;font-size:13px" class="muted">
                已有账号？<a style="color:var(--brand);font-weight:600" href="{{ url_for('auth.login') }}">返回登录</a>
            </div>
        </div>

        <div style="text-align:center;margin-top:20px">
            <a href="{{ url_for('web.index') }}" class="muted" style="font-size:12.5px;display:inline-flex;align-items:center;gap:4px">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg>
                返回首页在线体验
            </a>
        </div>
    </div>
</main>

<script>
function togglePasswordVisibility(btn) {
    const group = btn.closest('.password-group');
    if (!group) return;
    const input = group.querySelector('input');
    const eye = btn.querySelector('.icon-eye');
    const eyeOff = btn.querySelector('.icon-eye-off');
    if (!input) return;
    if (input.type === 'password') {
        input.type = 'text';
        if (eye) eye.style.display = 'none';
        if (eyeOff) eyeOff.style.display = 'block';
        btn.setAttribute('title', '隐藏密码');
    } else {
        input.type = 'password';
        if (eye) eye.style.display = 'block';
        if (eyeOff) eyeOff.style.display = 'none';
        btn.setAttribute('title', '显示密码');
    }
}
</script>
{% endblock %}
