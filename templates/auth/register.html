{% extends 'base_console.html' %}
{% block title %}注册客户账号{% endblock %}
{% block body %}
<main class="min-h-screen flex items-center justify-center p-4 bg-slate-50 relative selection:bg-indigo-100 selection:text-indigo-900">
    <div class="w-full max-w-md">
        <div class="text-center mb-8">
            <a href="{{ url_for('web.index') }}" title="返回首页" class="inline-flex items-center justify-center mb-3">
                <img src="{{ url_for('static', filename='images/logo-web.png') }}" alt="Media Parser Logo" class="w-12 h-12 rounded-2xl border border-slate-200 bg-white p-1 shadow-sm hover:scale-105 transition">
            </a>
            <h2 class="text-xl font-bold text-slate-900 tracking-tight">Media Parser 控制台</h2>
            <p class="text-xs text-slate-500 mt-1">多平台媒体解析与开放 API</p>
        </div>

        <div class="bg-white rounded-2xl border border-slate-200 shadow-xl shadow-slate-200/50 p-7">
            <h1 class="text-lg font-bold text-slate-900 mb-5">注册新账号</h1>

            {% for category, message in get_flashed_messages(with_categories=true) %}
            <div class="mb-4 flex items-center gap-2.5 px-3.5 py-2.5 rounded-xl border text-sm {{ 'border-red-200 text-red-700 bg-red-50' if category == 'error' else ('border-amber-200 text-amber-700 bg-amber-50' if category == 'warning' else 'border-emerald-200 text-emerald-800 bg-emerald-50') }}">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="shrink-0"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
                <span>{{ message }}</span>
            </div>
            {% endfor %}

            <form method="post" class="space-y-4">
                <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                <div class="space-y-1.5">
                    <label class="block text-xs font-semibold text-slate-700">用户名 <span class="text-slate-400 font-normal">(3 ~ 40 位)</span></label>
                    <input name="username" minlength="3" maxlength="40" placeholder="请输入用户名" autocomplete="username" required autofocus class="w-full px-3.5 py-2.5 text-sm rounded-lg border border-slate-200 focus:outline-none focus:border-brand focus:ring-2 focus:ring-brand/20 transition bg-white text-slate-900">
                </div>
                <div class="space-y-1.5">
                    <label class="block text-xs font-semibold text-slate-700">设置密码 <span class="text-slate-400 font-normal">(至少 8 位)</span></label>
                    <div class="password-group relative">
                        <input name="password" type="password" minlength="8" placeholder="请输入至少 8 位密码" autocomplete="new-password" required class="w-full px-3.5 py-2.5 pr-10 text-sm rounded-lg border border-slate-200 focus:outline-none focus:border-brand focus:ring-2 focus:ring-brand/20 transition bg-white text-slate-900">
                        <button type="button" class="password-toggle-btn absolute right-3 top-1/2 -translate-y-1/2 text-slate-400 hover:text-slate-700 p-1" aria-label="切换密码可见性" title="显示密码" onclick="togglePasswordVisibility(this)">
                            <svg class="icon-eye" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
                            <svg class="icon-eye-off hidden" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/></svg>
                        </button>
                    </div>
                </div>
                <div class="space-y-1.5">
                    <label class="block text-xs font-semibold text-slate-700">确认密码</label>
                    <div class="password-group relative">
                        <input name="confirm_password" type="password" minlength="8" placeholder="请再次输入密码" autocomplete="new-password" required class="w-full px-3.5 py-2.5 pr-10 text-sm rounded-lg border border-slate-200 focus:outline-none focus:border-brand focus:ring-2 focus:ring-brand/20 transition bg-white text-slate-900">
                        <button type="button" class="password-toggle-btn absolute right-3 top-1/2 -translate-y-1/2 text-slate-400 hover:text-slate-700 p-1" aria-label="切换密码可见性" title="显示密码" onclick="togglePasswordVisibility(this)">
                            <svg class="icon-eye" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
                            <svg class="icon-eye-off hidden" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/></svg>
                        </button>
                    </div>
                </div>
                <div class="pt-2">
                    <button type="submit" class="w-full h-11 flex items-center justify-center rounded-lg bg-brand hover:bg-indigo-700 text-white font-bold text-sm shadow-sm transition">立即注册</button>
                </div>
            </form>

            <div class="mt-5 pt-4 border-t border-slate-100 text-center text-xs text-slate-500">
                已有账号？<a class="text-brand font-bold hover:underline" href="{{ url_for('auth.login') }}">返回登录</a>
            </div>
        </div>

        <div class="text-center mt-6">
            <a href="{{ url_for('web.index') }}" class="text-xs text-slate-500 hover:text-slate-800 transition inline-flex items-center gap-1.5 font-medium">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg>
                返回首页在线体验
            </a>
        </div>
    </div>
</main>

<script>
function togglePasswordVisibility(btn) {
    const group = btn.closest('.password-group');
    if (!group) return;
    const input = group.querySelector('input');
    const eye = btn.querySelector('.icon-eye');
    const eyeOff = btn.querySelector('.icon-eye-off');
    if (!input) return;
    if (input.type === 'password') {
        input.type = 'text';
        if (eye) eye.classList.add('hidden');
        if (eyeOff) eyeOff.classList.remove('hidden');
        btn.setAttribute('title', '隐藏密码');
    } else {
        input.type = 'password';
        if (eye) eye.classList.remove('hidden');
        if (eyeOff) eyeOff.classList.add('hidden');
        btn.setAttribute('title', '显示密码');
    }
}
</script>
{% endblock %}
