
services:
  web:
    build: .
    container_name: media-parser-backend
    restart: always
    ports:
      - "8051:8051"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8051/api/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    volumes:
      # 将宿主机上的日志、静态视频目录映射，以便容器删除和重建时不丢失数据或便于排查问题
      - ./static/videos:/app/static/videos
      - ./logs:/app/logs
    # 设置容器内的时区为本地时区
    environment:
      - TZ=Asia/Shanghai
      - SECRET_KEY=${SECRET_KEY:-default_secret_key}
      - DOMAIN=${DOMAIN:-}
      - MAX_CACHE_SIZE_MB=${MAX_CACHE_SIZE_MB:-15}
      - XIAOHONGSHU_COOKIE=${XIAOHONGSHU_COOKIE:-}
      - DOUBAO_COOKIE=${DOUBAO_COOKIE:-}
      - YUANBAO_COOKIE=${YUANBAO_COOKIE:-}
